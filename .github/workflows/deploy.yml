name: Deploy to S3 on Merge

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  deploy:
    # This condition ensures the workflow only runs if the PR was merged, 
    # not just closed without merging.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # "." refers to the root of your repo. 
          # Change "." to your build folder (e.g., "./dist") if files are generated.
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude ".git/*" --exclude ".github/*"
